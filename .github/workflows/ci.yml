name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  training:
    name: Training (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  server:
    name: Server (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [training, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anu-server .